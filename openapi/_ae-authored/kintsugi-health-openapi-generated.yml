components:
  schemas:
    PatchFeedbackServerPhq9Request:
      type: object
      properties:
        session_id:
          type: string
          description: Session identifier from the Initiate endpoint.
        actual_score:
          type: array
          description: Array of 9 integers (0‑3) for PHQ‑9 items.
      required:
      - session_id
      - actual_score
    PostInitiateRequest:
      type: object
      properties:
        user_id:
          type: string
          description: User identifier
        is_initiated:
          type: boolean
          description: Flag indicating initiation
      required:
      - user_id
      - is_initiated
    PostInitiateResponse:
      type: object
      properties:
        session_id:
          type: string
          description: Unique identifier for the analysis session.
    PostPredictRequest:
      type: object
      properties:
        session_id:
          type: string
          description: Identifier of the session
        status:
          type: string
          description: Processing status
      required:
      - session_id
      - status
    PostPredictResponse:
      type: object
      properties:
        created_at:
          type: string
          description: Timestamp of creation
        disclaimer:
          type: string
        is_calibrated:
          type: boolean
        model_category:
          type: string
        model_granularity:
          type: string
        predicted_is_deepfake:
          type: boolean
        predicted_deepfake_score:
          type: integer
        predicted_score:
          type: string
        status:
          type: string
        updated_at:
          type: string
          description: Timestamp of last update
    PostPredictServerDepressionDepressionidRequest:
      type: object
      properties:
        file:
          type: string
          description: Binary data of a single‑channel WAV 44.1 kHz audio file.
        session_id:
          type: string
          description: Session identifier from the Initiate endpoint.
      required:
      - file
      - session_id
    PostPredictServerDepressionDepressionidResponse:
